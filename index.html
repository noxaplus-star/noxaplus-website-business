<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=noxaplus-website-business/">
  <title>NoxaPlus Business — در حال انتقال</title>
  <link rel="icon" href="noxaplus-website-business/assets/brand/mark-light.png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="noxaplus-website-business/assets/brand/mark-dark.png" media="(prefers-color-scheme: dark)">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f6fb;
      --fg: #161826;
      --muted: #5b6072;
      --card: #ffffff;
      --line: #e4e6f0;
      --accent: #6d3bff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0f18;
        --fg: #eef0f7;
        --muted: #a3a8ba;
        --card: #151827;
        --line: #262a3c;
        --accent: #9d7bff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(60% 70% at 50% 0%, rgba(109, 59, 255, .14), transparent 70%), var(--bg);
      color: var(--fg);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      text-align: center;
    }
    main {
      width: min(420px, 100%);
      padding: 32px 24px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
    }
    img { width: 140px; height: auto; display: block; margin: 0 auto 18px; }
    img.on-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      img.on-light { display: none; }
      img.on-dark { display: block; }
    }
    h1 { font-size: 1.1rem; margin: 0 0 6px; font-weight: 600; }
    p { margin: 0 0 6px; color: var(--muted); font-size: .9rem; line-height: 1.8; }
    .en { direction: ltr; }
    a {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 20px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: .9rem;
    }
    .bar {
      height: 4px;
      margin-top: 20px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }
    .bar span {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: inherit;
      background: var(--accent);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(360%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar span { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <img class="on-light" src="noxaplus-website-business/assets/brand/logo-light.png" alt="NoxaPlus">
    <img class="on-dark" src="noxaplus-website-business/assets/brand/logo-dark.png" alt="NoxaPlus">
    <h1>وب‌سایت در حال باز شدن است</h1>
    <p>اگر انتقال خودکار انجام نشد، روی دکمهٔ زیر بزنید.</p>
    <p class="en" lang="en" dir="ltr">The website is opening. Use the button below if nothing happens.</p>
    <a href="noxaplus-website-business/">ورود به وب‌سایت / Enter</a>
    <div class="bar" aria-hidden="true"><span></span></div>
    <script>location.replace("noxaplus-website-business/");</script>
    <noscript><p class="en" dir="ltr"><a href="noxaplus-website-business/">Open the website</a></p></noscript>
  </main>
</body>
</html>
